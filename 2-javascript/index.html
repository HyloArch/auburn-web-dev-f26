<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Project Manager</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>ProjectHub</h1>
    <h2>My Projects</h2>
    <div class="projects" id="projects-container"></div>
    <button id="new-project-button">Create New Project</button>
    <div class="project" id="new-project-form" hidden>
      <h3>New Project</h3>
      <div class="form-row">
        <label for="project-name">Name: </label>
        <input type="text" id="project-name" />
      </div>
      <div class="form-row">
        <label for="project-description">Description: </label>
        <textarea id="project-description"></textarea>
      </div>
      <div class="form-actions">
        <button id="create-project">Create</button>
        <button id="cancel-project">Cancel</button>
      </div>
    </div>
  </body>
</html>
